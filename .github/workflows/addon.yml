name: Add-on

on:
  push:
    paths: ["hausgeist/**", ".github/workflows/addon.yml"]
  pull_request:
    paths: ["hausgeist/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hausgeist/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hausgeist/app/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    # Baut das Image wie Home Assistant auf dem Pi (aarch64, per Emulation).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image für aarch64 bauen
        uses: docker/build-push-action@v6
        with:
          context: hausgeist
          platforms: linux/arm64
          build-args: BUILD_FROM=ghcr.io/home-assistant/aarch64-base:3.21
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
