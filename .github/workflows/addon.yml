name: Add-on

on:
  push:
    paths: ["hausgeist/**", ".github/workflows/addon.yml"]
  pull_request:
    paths: ["hausgeist/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hausgeist/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hausgeist/app/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    # Fertiges Image je Architektur auf echten Runnern bauen und (auf main) nach ghcr.io laden.
    # Home Assistant lädt es dann nur noch herunter, statt auf dem Pi selbst zu bauen.
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        id: v
        run: |
          v=$(sed -nE 's/^version: *"?([^"]+)"?/\1/p' hausgeist/config.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Bei ghcr.io anmelden
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image für ${{ matrix.arch }} bauen
        uses: docker/build-push-action@v6
        with:
          context: hausgeist
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.21
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/gianlucako95/hausgeist-${{ matrix.arch }}:${{ steps.v.outputs.version }}
            ghcr.io/gianlucako95/hausgeist-${{ matrix.arch }}:latest
          labels: |
            io.hass.version=${{ steps.v.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/GianlucaKo95/Hausgeist
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
