name: TestFlight

# Startet manuell (Actions → TestFlight → Run workflow) oder bei einem Tag wie v0.7.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode auswählen
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
      - name: Bauen, signieren und hochladen
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: ./ci/testflight.sh

  # Zertifikat dieses Laufs freigeben, sobald Apple den Build verarbeitet hat (max. 2 Distributionszertifikate
  # je Team – Meeterz, Couchpotato und Wizzo brauchen den Platz auch)
  release-cert:
    needs: upload
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Zertifikat freigeben
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          CI_PREFIX: Hausgeist CI
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/key.p8"
          python3 ci/asc.py release "$GITHUB_RUN_NUMBER" de.hausgeist.koeven
