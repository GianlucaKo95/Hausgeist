name: TestFlight

# Startet manuell (Actions → TestFlight → Run workflow) oder bei einem Tag wie v0.7.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    # Apple verlangt ab April 2027 das iOS-27-SDK → Xcode 27 (gleicher Runner wie Meeterz)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 27 (Release, keine Beta) auswählen
        run: |
          # Beta-Builds erkennt man am Kleinbuchstaben am Ende der Build-Nummer (Apple lehnt sie ab)
          for dir in $(ls -d /Applications/Xcode_27* 2>/dev/null | grep -viE "beta|candidate|_RC" | sort -Vr); do
            build=$(DEVELOPER_DIR="$dir" xcodebuild -version 2>/dev/null | awk '/Build version/ {print $3}')
            echo "Kandidat: $dir ($build)"
            if [ -n "$build" ] && ! echo "$build" | grep -q '[a-z]$'; then sudo xcode-select -s "$dir"; break; fi
          done
          xcodebuild -version
      - name: Bauen, signieren und hochladen
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: ./ci/testflight.sh

  # Zertifikat dieses Laufs freigeben, sobald Apple den Build verarbeitet hat (max. 2 Distributionszertifikate
  # je Team – Meeterz, Couchpotato und Wizzo brauchen den Platz auch)
  release-cert:
    needs: upload
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Zertifikat freigeben
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          CI_PREFIX: Hausgeist CI
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/key.p8"
          python3 ci/asc.py release "$GITHUB_RUN_NUMBER" de.hausgeist.koeven
