name: Hausgeist
version: "0.17.0"
slug: hausgeist
description: Persönliches Agenten-Netzwerk mit Master-Agent und acht Fachagenten
url: https://github.com/GianlucaKo95/hausgeist
# Fertiges Image von GitHub – Home Assistant lädt es nur herunter, statt auf dem Pi zu bauen.
image: "ghcr.io/gianlucako95/hausgeist-{arch}"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
watchdog: "http://[HOST]:[PORT:8099]/api/health"
panel_icon: mdi:ghost
panel_title: Hausgeist
ports:
  8099/tcp: null
ports_description:
  8099/tcp: API für die Hausgeist-App (über VPN freigeben)
startup: application
boot: auto
homeassistant_api: true
hassio_api: false
options:
  anthropic_api_key: ""
  model: claude-sonnet-5-5
  supabase_url: ""
  supabase_service_key: ""
  paperless_url: ""
  paperless_token: ""
  payment_mode: dryrun
  fints_product_id: ""
  mailboxes: []
  icloud_user: ""
  icloud_app_password: ""
  calendars: []
  calendar_feeds: []
  ha_calendars: []
  calendar_insights: true
  evening_check: "18:00"
  ha_entities: []
  energy: {}
  github_token: ""
  serpapi_key: ""
  apns_key_id: ""
  apns_team_id: ""
  apns_key: ""
  apns_bundle_id: de.hausgeist.koeven
  daily_brief: "07:30"
  mail_triage: true
  weekly_offers: true
  log_level: info
schema:
  anthropic_api_key: password
  model: str
  supabase_url: url
  supabase_service_key: password
  paperless_url: str
  paperless_token: password
  payment_mode: list(dryrun|fints)
  fints_product_id: str?
  mailboxes:
    - name: str
      host: str
      port: port
      tls: bool
      user: str
      password: password
      folder: str?
      smtp_host: str?
      smtp_port: port?
      from_name: str?
  icloud_user: str
  icloud_app_password: password
  calendars:
    - name: str
      owner: str
  calendar_feeds:
    - name: str
      url: str
      owner: str?
  ha_calendars:
    - name: str
      entity_id: str
      owner: str?
  calendar_insights: bool
  evening_check: str?
  ha_entities:
    - str
  energy:
    pv_power: str?
    battery_soc: str?
    battery_power: str?
    grid_power: str?
    house_power: str?
  github_token: password
  serpapi_key: password
  apns_key_id: str
  apns_team_id: str
  apns_key: password
  apns_bundle_id: str
  daily_brief: str?
  mail_triage: bool
  weekly_offers: bool
  log_level: list(debug|info|warn|error)
