name: Hausgeist
version: "0.2.0"
slug: hausgeist
description: Persönliches Agenten-Netzwerk mit Master-Agent und acht Fachagenten
url: https://github.com/GianlucaKo95/hausgeist
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:ghost
panel_title: Hausgeist
ports:
  8099/tcp: null
ports_description:
  8099/tcp: API für die eigene App (optional)
startup: application
boot: auto
homeassistant_api: true
hassio_api: false
options:
  anthropic_api_key: ""
  model: claude-sonnet-5-5
  supabase_url: ""
  supabase_service_key: ""
  paperless_url: ""
  paperless_token: ""
  payment_mode: dryrun
  mailboxes: []
  icloud_user: ""
  icloud_app_password: ""
  calendars: []
  ha_entities: []
  energy: {}
  github_token: ""
  api_token: ""
  daily_brief: "07:30"
  log_level: info
schema:
  anthropic_api_key: password
  model: str
  supabase_url: url
  supabase_service_key: password
  paperless_url: str
  paperless_token: password
  payment_mode: list(dryrun|fints)
  mailboxes:
    - name: str
      host: str
      port: port
      tls: bool
      user: str
      password: password
      folder: str?
      smtp_host: str?
      smtp_port: port?
      from_name: str?
  icloud_user: str
  icloud_app_password: password
  calendars:
    - name: str
      owner: str
  ha_entities:
    - str
  energy:
    pv_power: str?
    battery_soc: str?
    battery_power: str?
    grid_power: str?
    house_power: str?
  github_token: password
  api_token: password
  daily_brief: str?
  log_level: list(debug|info|warn|error)
