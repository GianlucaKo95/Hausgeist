name: Hausgeist
options:
  bundleIdPrefix: de.koeven
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # in Xcode unter Signing & Capabilities setzen
targets:
  Hausgeist:
    type: application
    platform: iOS
    sources:
      - Hausgeist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.koeven.hausgeist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Hausgeist/Info.plist
      properties:
        CFBundleDisplayName: Hausgeist
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false   # nur HTTPS/Standardverschlüsselung → keine Exportabfrage in TestFlight
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Die App spricht den Pi über das VPN per HTTP an (Tailscale/WireGuard
        # verschlüsselt die Verbindung). Nur lokale/VPN-Adressen sind erlaubt.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Hausgeist verbindet sich mit deinem Home-Assistant-Server.
        NSCameraUsageDescription: Zum Scannen von Briefen, Rechnungen und Verträgen.
        NSMicrophoneUsageDescription: Damit du mit dem Hausgeist sprechen kannst.
        NSSpeechRecognitionUsageDescription: Deine Sprache wird in Text umgewandelt – wenn möglich direkt auf dem iPhone.
        CFBundleDevelopmentRegion: de
