name: Hausgeist
options:
  bundleIdPrefix: de.hausgeist
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.7.2"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # in Xcode unter Signing & Capabilities setzen
targets:
  Hausgeist:
    type: application
    platform: iOS
    sources:
      - Hausgeist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hausgeist.koeven
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Hausgeist/Hausgeist.entitlements
      properties:
        aps-environment: development      # beim Archivieren für TestFlight automatisch production
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Hausgeist/Info.plist
      properties:
        CFBundleDisplayName: Hausgeist
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false   # nur HTTPS/Standardverschlüsselung → keine Exportabfrage in TestFlight
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          # Der Server wird per HTTP über das VPN (Tailscale/WireGuard verschlüsselt) oder
          # im eigenen WLAN angesprochen – auch per IP-Adresse (100.x.x.x, 192.168.x.x),
          # für die ATS keine Ausnahmen per Domain kennt. Supabase läuft weiterhin über HTTPS.
          # Achtung: NSAllowsLocalNetworking würde NSAllowsArbitraryLoads aushebeln, daher nicht setzen.
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Hausgeist verbindet sich mit deinem Home-Assistant-Server.
        NSCameraUsageDescription: Zum Scannen von Briefen, Rechnungen und Verträgen.
        NSMicrophoneUsageDescription: Damit du mit dem Hausgeist sprechen kannst.
        NSSpeechRecognitionUsageDescription: Deine Sprache wird in Text umgewandelt – wenn möglich direkt auf dem iPhone.
        CFBundleDevelopmentRegion: de
